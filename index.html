<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Пулмо – слики</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f5f3; --card:#fff; --ink:#1d2421; --mute:#7b857f; --line:#e3e7e4;
  --accent:#1f7a5c; --accent-soft:#e3f2ec; --warn:#a15c00; --warn-soft:#fff1d9; --ok:#1f7a5c; --todo:#b3541e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141816;--card:#1c211e;--ink:#e8ece9;--mute:#8d9892;--line:#2c332f;--accent:#4cc99b;--accent-soft:#1d3329;--warn:#f0b35a;--warn-soft:#3a2d14;--ok:#4cc99b;--todo:#f0a070}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.sync{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);margin:-4px 0 8px}
.sync button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:12px}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tabs button{flex:1;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
.tools input[type=search]{flex:1;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}
.tgl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
section>h2{margin:0;padding:11px 14px;font-size:13px;letter-spacing:.03em;display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--accent-soft)}
section>h2 small{font-weight:400;color:var(--mute);letter-spacing:0;white-space:nowrap}
.cols{display:none}
.row{padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.name{font-weight:600}
.name .n{color:var(--mute);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.title{color:var(--mute);font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ctl input[type=text],.ctl select{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.ctl input.nt{width:100%;text-align:left;flex:1 1 100%}
.ctl input[type=text]:not(.nt){width:78px;text-align:center;font-variant-numeric:tabular-nums}
.cb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);padding:4px 6px;min-height:44px}
.cb input{width:26px;height:26px;accent-color:var(--accent)}
select.st{font-weight:600}
select.st.done{color:var(--ok);border-color:var(--ok)}
select.st.todo{color:var(--todo)}
.note{margin-top:6px;font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px;display:inline-block}
.row.done .name .t,.row.done .title{text-decoration:line-through}
.row.done{opacity:.6}
.sep{padding:5px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);background:var(--bg);border-bottom:1px solid var(--line)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.foot button{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}
@media (min-width:700px){
  .cols,.row{display:grid;grid-template-columns:1.4fr 1fr 70px 56px 125px 112px 1.2fr;gap:10px;align-items:center}
  .cols.d,.row.d{grid-template-columns:1.6fr 1.2fr 90px 90px}
  .cols{padding:7px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line)}
  .ctl{display:contents;margin:0}
  .note{grid-column:1/-1;justify-self:start;margin:0}
  .cb{justify-content:center;padding:0}
  .ctl input[type=text]:not(.nt){width:100%}
}

.tb2{flex-wrap:wrap}
.tb2 select{flex:1 1 140px;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}
.tb2 button{padding:9px 12px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:600}
#pv{display:none}
section>h2{cursor:pointer;user-select:none}
section.col>:not(h2){display:none}
.tb2 button.gh{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:400}
@media print{
  header,main,.foot{display:none!important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  #pv{display:block;font:11px/1.3 Arial,sans-serif;color:#000}
  #pv h1{font-size:15px;margin:0 0 2px}
  #pv .pm{color:#444;margin:0 0 8px}
  #pv table{width:100%;border-collapse:collapse}
  #pv th,#pv td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
  #pv th{background:#e8e8e8}
  #pv thead{display:table-header-group}
  #pv tr{page-break-inside:avoid}
  #pv td.g{background:#f0f0f0;font-weight:700}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Пулмо – листа за фотографирање</h1>
  <div class="tabs"><button id="t1" class="on">1 · Собирање</button><button id="t2">2 · Дизајн</button></div>
  <div class="sub" id="sub"></div>
  <div class="sync"><span id="syncmsg">Не е синхронизирано</span><button id="signin">Најава со Google</button></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Барај име, звање или ID…" autocomplete="off">
    <label class="tgl"><input type="checkbox" id="hide"> Сокриј готови</label>
    <label class="tgl"><input type="checkbox" id="nopic"> Само без слика (без отказ)</label>
  </div>
  <div class="tools tb2" id="tb">
    <select id="flt" aria-label="Прикажи">
      <option value="all">Прикажи: сите</option>
      <option value="todo">Само незавршени</option>
      <option value="done">Само ГОТОВИ</option>
      <option value="nonum">Уште нема број на слика</option>
      <option value="email">Слика по е-пошта (треба да испратат)</option>
      <option value="photo">Сликан</option>
      <option value="nosrc">Нема информација: сликан или е-пошта?</option>
      <option value="hascard">Картичката е земена</option>
      <option value="nocard">Картичката НЕ е земена</option>
    </select>
    <select id="srt" aria-label="Подреди">
      <option value="sec">Подреди: по група</option>
      <option value="id">По ID</option>
      <option value="name">По име А–Ш</option>
      <option value="status">По статус (незавршени први)</option>
      <option value="src">По извор (без информација први)</option>
      <option value="num">По број на слика</option>
    </select>
    <button id="fold" class="gh">Собери ги сите</button>
    <button id="pdf">Извези PDF</button>
  </div>
</header>
<main id="main"></main>
<div id="pv"></div>
<div class="foot">
  <button id="exp">Копирај бекап</button>
  <button id="imp">Врати бекап</button>
  <button id="ldp">Вчитај листа на вработени</button><input type="file" id="pf" accept=".json,application/json" hidden>
</div>
</div>

<script>
// [section, listNo, title, name, photo#, photographedByDefault, note]
const SECTIONS = [
  ["doc","ДОКТОРИ НА МЕДИЦИНА",""],
  ["nur","МЕДИЦИНСКИ СЕСТРИ/ТЕХНИЧАРИ",""],
  ["rad","ДИПЛОМИРАНИ РАДИОЛОШКИ ТЕХНОЛОЗИ",""],
  ["adm","АДМИНИСТРАЦИЈА",""],
  ["hs","ЗДРАВСТВЕНИ СОРАБОТНИЦИ",""],
  ["aux","ПОМОШНО ТЕХНИЧКИ ПЕРСОНАЛ",""],
  ["oth","ДОГОВОР НА ДЕЛО",""]
];
const SECNO={doc:1,nur:2,rad:3,adm:4,hs:5,aux:6,oth:7};
let people=[];
function setPeople(D){ people=D.map(r=>({uid:SECNO[r[0]]*100+r[1],id:r[0]+r[1],sec:r[0],title:r[2],name:r[3],num:r[4]||"",pre:!!r[5],note:r[6]||""})); }
const LSP="pulmo-people-v1";
try{ const s=localStorage.getItem(LSP); if(s) setPeople(JSON.parse(s)); }catch(e){}
function D_cur(){ try{return JSON.parse(localStorage.getItem(LSP)||"[]");}catch(e){return [];} }
function savePeople(arr,fromCloud){
  setPeople(arr);
  try{localStorage.setItem(LSP,JSON.stringify(arr));}catch(e){}
  if(!fromCloud&&peopleRef){ peopleRef.set({list:JSON.stringify(arr)}).catch(e=>msg("Грешка при синхронизација: "+e.code)); }
  render();
}

// ---- state ----
// f[id] = {n:photo#, card:bool, src:""|"photo"|"email", status:"todo"|"done", ph:bool, de:bool}
let st = {f:{}};
const LS="pulmo-photo-v2", LS1="pulmo-photo-checklist-v1";
try{
  const s=JSON.parse(localStorage.getItem(LS)||"null");
  if(s&&s.f) st=s;
  else{ // migrate from first version
    const o=JSON.parse(localStorage.getItem(LS1)||"null");
    if(o&&o.done){ for(const id in o.done){ st.f[id]=Object.assign(st.f[id]||{},{status:o.done[id]?"done":"todo"}); if(o.done[id]) st.f[id].src="photo"; }
      for(const id in (o.nums||{})){ st.f[id]=Object.assign(st.f[id]||{},{n:o.nums[id]}); } }
  }
}catch(e){}
const F=p=>st.f[p.id]||{};
const status=p=>F(p).status || (p.pre?"done":"todo");
const isDone=p=>status(p)==="done";
const src=p=>F(p).src!==undefined ? F(p).src : (p.pre?"photo":"");
const numOf=p=>F(p).n!==undefined ? F(p).n : p.num;
const noteOf=p=>F(p).note!==undefined ? F(p).note : p.note;
const cardOf=p=>!!F(p).card;
const phOf=p=>F(p).ph!==undefined ? F(p).ph : isDone(p);
const deOf=p=>!!F(p).de;
function set(p,k,v){ (st.f[p.id]=st.f[p.id]||{})[k]=v; persist(); push(p.id,k,v); }
function persist(){ try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){} }

let tab=1;
const main=document.getElementById("main"), q=document.getElementById("q"), hide=document.getElementById("hide"), nopic=document.getElementById("nopic");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function row1(p){
  const d=isDone(p), s=src(p);
  return `<div class="row${d?" done":""}" data-id="${p.id}">
    <div><div class="name"><span class="n">${p.uid}</span><span class="t">${esc(p.name)}</span></div><div class="title">${esc(p.title)}</div></div>
    <div class="ctl">
      <input type="text" inputmode="decimal" placeholder="Бр. на слика" value="${esc(numOf(p))}" data-k="n" aria-label="Број на слика">
      <label class="cb"><input type="checkbox" data-k="card" ${cardOf(p)?"checked":""} aria-label="Картичката е земена"><span class="m">Картичка</span></label>
      <select data-k="src" aria-label="Сликан или слика по е-пошта">
        <option value=""${s===""?" selected":""}>— извор —</option>
        <option value="photo"${s==="photo"?" selected":""}>Сликан</option>
        <option value="email"${s==="email"?" selected":""}>Е-пошта</option>
      </select>
      <select data-k="status" class="st ${d?"done":"todo"}" aria-label="Статус">
        <option value="todo"${d?"":" selected"}>Незавршено</option>
        <option value="done"${d?" selected":""}>ГОТОВО</option>
      </select>
      <input type="text" class="nt" placeholder="Забелешки" value="${esc(noteOf(p))}" data-k="note" aria-label="Забелешки">
    </div>
  </div>`;
}
function row2(p){
  const d=deOf(p);
  return `<div class="row d${d?" done":""}" data-id="${p.id}">
    <div><div class="name"><span class="n">${p.uid}</span><span class="t">${esc(p.name)}</span></div><div class="title">${esc(p.title)}</div></div>
    <div class="ctl">
      <label class="cb"><input type="checkbox" data-k="ph" ${phOf(p)?"checked":""} aria-label="Слика"><span class="m">Слика</span></label>
      <label class="cb"><input type="checkbox" data-k="de" ${d?"checked":""} aria-label="Дизајн"><span class="m">Дизајн</span></label>
    </div>
  </div>`;
}
const flt=document.getElementById("flt"), srt=document.getElementById("srt");
let collapsed={}; try{collapsed=JSON.parse(localStorage.getItem("pulmo-collapsed")||"{}");}catch(e){}
function saveCol(){try{localStorage.setItem("pulmo-collapsed",JSON.stringify(collapsed));}catch(e){}}
const nrank=p=>{const n=String(numOf(p)||"").trim(); if(!n) return Infinity; const v=Number(n.split(".").pop()); return isNaN(v)?Infinity:v;};
const srank=p=>({"":0,email:1,photo:2}[src(p)]);
const FLT={
  all:p=>true, todo:p=>!isDone(p), done:p=>isDone(p), nonum:p=>!String(numOf(p)||"").trim(),
  email:p=>src(p)==="email", photo:p=>src(p)==="photo", nosrc:p=>src(p)==="", hascard:p=>!!cardOf(p), nocard:p=>!cardOf(p)
};
const SRT={
  id:(a,b)=>a.uid-b.uid, name:(a,b)=>a.name.localeCompare(b.name,"mk")||a.uid-b.uid,
  status:(a,b)=>(isDone(a)-isDone(b))||a.uid-b.uid, src:(a,b)=>(srank(a)-srank(b))||a.uid-b.uid,
  num:(a,b)=>(nrank(a)===nrank(b)?a.uid-b.uid:(nrank(a)<nrank(b)?-1:1))
};
function visible(){
  const term=q.value.trim().toLowerCase();
  const fin1=tab===1?isDone:deOf;
  return people.filter(p=>(!term||(p.uid+" "+p.name+" "+p.title).toLowerCase().includes(term))
    && (!hide.checked||!fin1(p)) && (!nopic.checked||(!isDone(p)&&!/ОТКАЗ/i.test(noteOf(p)||""))) && (tab!==1||FLT[flt.value](p)));
}
function render(){
  const fin1=tab===1?isDone:deOf;
  const filtering=!!q.value.trim()||hide.checked||nopic.checked||(tab===1&&flt.value!=="all");
  document.getElementById("tb").style.display="flex";
  flt.style.display=tab===1?"":"none";
  if(!people.length){
    main.innerHTML='<div class="empty">Листата на вработени не е вчитана.<br>Најавете се со Google (горе) или притиснете <b>Вчитај листа на вработени</b> долу и изберете <b>staff.json</b>.</div>';
    document.getElementById("sub").textContent="";document.getElementById("bar").style.width="0";return;
  }
  const total=people.length, doneAll=people.filter(fin1).length;
  const vis=visible(), rf=tab===1?row1:row2;
  const hdr=tab===1?`<div class="cols"><span>ID · Име</span><span>Звање</span><span>Бр. слика</span><span>Картичка</span><span>Извор</span><span>Статус</span><span>Забелешки</span></div>`
               :`<div class="cols d"><span>ID · Име</span><span>Звање</span><span>Слика</span><span>Дизајн</span></div>`;
  let html="";
  if(srt.value!=="sec"){
    const list=vis.slice().sort(SRT[srt.value]);
    if(list.length) html=`<section><h2><span>${esc(srt.options[srt.selectedIndex].text)}</span><small>${list.length} прикажани</small></h2>${hdr}${list.map(rf).join("")}</section>`;
  } else {
    for(const [key,mk,en] of SECTIONS){
      const all=people.filter(p=>p.sec===key);
      const dn=all.filter(fin1).length;
      const list=vis.filter(p=>p.sec===key);
      if(!list.length) continue;
      const pend=list.filter(p=>!fin1(p)), fin=list.filter(fin1);
      const cl=collapsed[key]&&!filtering;
      html+=`<section class="${cl?"col":""}"><h2 data-sec="${key}"><span>${cl?"▸":"▾"} ${mk}</span><small>${all.length-dn} остануваат од ${all.length}</small></h2>
        ${hdr}
        ${pend.map(rf).join("")}
        ${fin.length&&pend.length?`<div class="sep">Готови (${fin.length})</div>`:""}
        ${fin.map(rf).join("")}</section>`;
    }
  }
  main.innerHTML=html||`<div class="empty">Нема резултати.</div>`;
  document.getElementById("bar").style.width=(doneAll/total*100)+"%";
  document.getElementById("sub").textContent= (tab===1
    ? `${doneAll} од ${total} ГОТОВИ · уште ${total-doneAll} за собирање`
    : `${doneAll} од ${total} дизајни завршени · уште ${total-doneAll} за дизајн`)
    + (vis.length!==total?` · прикажани ${vis.length}`:"");
  document.getElementById("t1").classList.toggle("on",tab===1);
  document.getElementById("t2").classList.toggle("on",tab===2);
}
function exportPDF(){
  const vis=visible(), by=srt.value, ck=b=>b?"✓":"";
  const lab=[tab===1?"Собирање":"Дизајн", tab===1&&flt.value!=="all"?flt.options[flt.selectedIndex].text:"", by!=="sec"?srt.options[srt.selectedIndex].text:""].filter(Boolean).join(" · ");
  const SL={"":"—",photo:"Сликан",email:"Е-пошта"};
  const cols=tab===1?["ID","Име","Звање","Бр. слика","Картичка","Извор","Статус","Забелешки"]:["ID","Име","Звање","Слика","Дизајн"];
  const tr=p=>tab===1
    ?`<tr><td>${p.uid}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.title)}</td><td>${esc(numOf(p))}</td><td>${ck(cardOf(p))}</td><td>${SL[src(p)]}</td><td>${isDone(p)?"ГОТОВО":"Незавршено"}</td><td>${esc(noteOf(p))}</td></tr>`
    :`<tr><td>${p.uid}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.title)}</td><td>${ck(phOf(p))}</td><td>${ck(deOf(p))}</td></tr>`;
  let body="";
  if(by==="sec"){
    for(const [key,mk] of SECTIONS){ const l=vis.filter(p=>p.sec===key); if(l.length) body+=`<tr><td class="g" colspan="${cols.length}">${mk} (${l.length})</td></tr>`+l.map(tr).join(""); }
  } else body=vis.slice().sort(SRT[by]).map(tr).join("");
  const d=new Date().toLocaleDateString("en-GB");
  document.getElementById("pv").innerHTML=`<h1>Пулмо – листа за фотографирање</h1><div class="pm">${esc(lab)} · ${vis.length} лица · ${d}</div>
    <table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
  setTimeout(()=>window.print(),50);
}
const byId=id=>people.find(p=>p.id===id);
main.addEventListener("change",e=>{
  const t=e.target, row=t.closest(".row"); if(!row) return;
  const p=byId(row.dataset.id), k=t.dataset.k; if(!p||!k) return;
  if(t.type==="checkbox"){ set(p,k,t.checked); render(); }
  else if(k==="status"){ set(p,"status",t.value); render(); }
  else if(k==="src"){ set(p,"src",t.value); }
  else if(k==="note") set(p,"note",t.value);
  else set(p,"n",t.value.trim());
});
main.addEventListener("input",e=>{
  const t=e.target, row=t.closest(".row"); if(!row||(t.dataset.k!=="n"&&t.dataset.k!=="note")) return;
  set(byId(row.dataset.id),t.dataset.k==="note"?"note":"n",t.value);
});
document.getElementById("t1").onclick=()=>{tab=1;render();window.scrollTo(0,0)};
document.getElementById("t2").onclick=()=>{tab=2;render();window.scrollTo(0,0)};
q.addEventListener("input",render);
hide.addEventListener("change",render);
nopic.addEventListener("change",render);
flt.addEventListener("change",render);
srt.addEventListener("change",render);

let docRef=null, peopleRef=null, firstSync=true;
const msg=m=>{document.getElementById("syncmsg").textContent=m;};
function push(id,k,v){
  if(!docRef) return;
  try{ docRef.set({f:{[id]:{[k]:v}}},{merge:true}).catch(e=>msg("Грешка при синхронизација: "+e.code)); }catch(e){}
}
function startSync(user){
  const db=firebase.firestore();
  docRef=db.collection("pulmo").doc("state");
  peopleRef=db.collection("pulmo").doc("people");
  msg("Синхронизација како "+user.email+"…");
  document.getElementById("signin").textContent="Одјава";
  peopleRef.onSnapshot(s=>{
    if(s.metadata.hasPendingWrites) return;
    if(s.exists&&s.data().list){ try{ savePeople(JSON.parse(s.data().list),true); }catch(e){} }
    else if(people.length){ peopleRef.set({list:JSON.stringify(D_cur())}).catch(()=>{}); }
  });
  docRef.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    const cloud=(snap.exists&&snap.data().f)||{};
    if(firstSync){
      firstSync=false;
      const up={};
      for(const id in st.f) for(const k in st.f[id]){ if(!(cloud[id]&&k in cloud[id])){ (up[id]=up[id]||{})[k]=st.f[id][k]; } }
      if(Object.keys(up).length) docRef.set({f:up},{merge:true}).catch(e=>msg("Грешка при синхронизација: "+e.code));
    }
    for(const id in cloud) st.f[id]=Object.assign(st.f[id]||{},cloud[id]);
    persist();
    const a=document.activeElement;
    if(!(a&&a.tagName==="INPUT"&&a.type==="text"&&main.contains(a))) render();
    msg("Синхронизирано ✓ "+user.email+(snap.metadata.fromCache?" (офлајн)":""));
  },err=>msg("Грешка при синхронизација: "+err.code));
}
function initFB(){
  if(typeof firebase==="undefined"){ msg("Офлајн – зачувано само на овој телефон"); return; }
  firebase.initializeApp(FB);
  try{ firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  const auth=firebase.auth();
  auth.onAuthStateChanged(u=>{
    if(u){ startSync(u); }
    else{ docRef=null; peopleRef=null; firstSync=true; document.getElementById("signin").textContent="Најава со Google"; msg("Не е синхронизирано – зачувано само на овој телефон"); }
  });
  document.getElementById("signin").onclick=async()=>{
    if(auth.currentUser){ await auth.signOut(); return; }
    const pr=new firebase.auth.GoogleAuthProvider();
    try{ await auth.signInWithPopup(pr); }
    catch(e){ if(e.code!=="auth/popup-closed-by-user"){ try{ await auth.signInWithRedirect(pr); }catch(e2){ msg("Грешка при најава: "+e2.code); } } }
  };
  auth.getRedirectResult().catch(e=>msg("Грешка при најава: "+e.code));
}
document.getElementById("ldp").onclick=()=>document.getElementById("pf").click();
document.getElementById("pf").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const arr=JSON.parse(await f.text()); if(!Array.isArray(arr)) throw 0; savePeople(arr,false); }catch(x){ alert("Невалидна датотека со листа."); }
  e.target.value="";
};
render();
initFB();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
